<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diagnóstico</title>
  <style>
    body { font-family: monospace; background:#111; color:#0f0; padding:2rem; font-size:16px; line-height:1.8; }
    .ok { color:#0f0; } .bad { color:#f55; } .warn { color:#ff0; }
    h1 { color:#f2c14e; }
  </style>
</head>
<body>
  <h1>Diagnóstico Home Rules</h1>
  <div id="out">Ejecutando…</div>

  <script>
    const out = document.getElementById("out");
    const lines = [];
    const add = (label, val, good) => {
      const cls = good === true ? "ok" : good === false ? "bad" : "warn";
      lines.push(`<div class="${cls}">${label}: <b>${val}</b></div>`);
      out.innerHTML = lines.join("");
    };

    // 1. ¿reduce-motion activo?
    const rm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    add("Reducir movimiento (reduce-motion)", rm ? "ACTIVADO" : "desactivado", !rm);

    // 2. ¿Carga el CSS principal? Comprobamos una variable definida en :root
    fetch("styles.css?v=diag").then(r => {
      add("styles.css se puede cargar", r.ok ? "SI (" + r.status + ")" : "NO (" + r.status + ")", r.ok);
    }).catch(e => add("styles.css se puede cargar", "ERROR: " + e.message, false));

    // 3. ¿Carga el JS principal?
    fetch("main.js?v=diag").then(r => {
      add("main.js se puede cargar", r.ok ? "SI (" + r.status + ")" : "NO (" + r.status + ")", r.ok);
    }).catch(e => add("main.js se puede cargar", "ERROR: " + e.message, false));

    // 4. ¿Existen las imágenes de solución?
    ["assets/solucion1.svg","assets/solucion2.svg","assets/imagen1.png"].forEach(src => {
      fetch(src).then(r => add("Existe " + src, r.ok ? "SI" : "NO ("+r.status+")", r.ok))
                .catch(e => add("Existe " + src, "ERROR", false));
    });

    // 5. Navegador
    add("Navegador", navigator.userAgent, null);
  </script>
</body>
</html>
